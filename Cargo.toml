[package]
name = "factlet"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }

[features]
# The `factlet` command, and `factlet::cli` for binaries with their own domain.
cli = ["dep:clap"]

[[bin]]
name = "factlet"
required-features = ["cli"]
